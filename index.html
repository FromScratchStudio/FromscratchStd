<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
        content="FromScratch Creative Studio — illustrations, music production, and visual storytelling.">
  <meta property="og:title"       content="FromScratch Studio">
  <meta property="og:description"
        content="A sanctuary of gritty innovation crafting multi-format content and urban artwork.">
  <meta property="og:type"        content="website">

  <link rel="icon" type="image/png" href="img/logos/fromScratchStudio-transparent-final.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gruppo&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style/animations.css">
  <link rel="stylesheet" href="style/main.css">

  <title>FromScratch Studio</title>
</head>
<body>

  <!-- ── Language switcher ─────────────────────────────────── -->
  <div id="lang-switcher" aria-label="Language switcher">
    <button class="lang-btn is-active"
            data-lang="en"
            aria-label="Switch to English"
            aria-pressed="true">
      <img src="img/icons/enLang.gif" alt="EN" loading="eager">
    </button>
    <button class="lang-btn"
            data-lang="fr"
            aria-label="Passer en français"
            aria-pressed="false">
      <img src="img/icons/frLang.png" alt="FR" loading="eager">
    </button>
  </div>

  <!-- ── Site header ───────────────────────────────────────── -->
  <header id="site-title" aria-label="Site name">FromScratch Studio</header>

  <!-- ── Intro screen ──────────────────────────────────────── -->
  <main id="intro" aria-label="Intro">

    <!-- Main centre circle — Studio -->
    <div id="circle-main"
         class="circle-orbit"
         data-section="fromScratchStudio"
         role="button"
         tabindex="0"
         aria-label="Open FromScratch Studio">
      <img id="circle-ring-main"
           class="circle-ring"
           src="img/gallery/WhitePaperCovers/RouePattern.jpg"
           alt=""
           aria-hidden="true">
      <div class="circle-inner">
        <img class="circle-logo"
             src="img/logos/fromScratchStudioFinal.png"
             alt="FromScratch Studio logo"
             loading="eager">
      </div>
    </div>

    <!-- NE satellite — Pictures / Stories -->
    <div id="circle-ne"
         class="circle-orbit circle-satellite"
         data-section="fromScratchPictures"
         role="button"
         tabindex="0"
         aria-label="Open FromScratch Stories">
      <img id="circle-ring-ne"
           class="circle-ring"
           src="img/gallery/WhitePaperCovers/RouePattern.jpg"
           alt=""
           aria-hidden="true">
      <div class="circle-inner">
        <img class="circle-logo"
             src="img/logos/FromScratchPictures-WhireBGSimple.png"
             alt="FromScratch Stories logo"
             loading="lazy">
      </div>
    </div>

    <!-- SE satellite — Records -->
    <div id="circle-se"
         class="circle-orbit circle-satellite"
         data-section="fromScratchRecords"
         role="button"
         tabindex="0"
         aria-label="Open FromScratch Records">
      <img id="circle-ring-se"
           class="circle-ring"
           src="img/gallery/WhitePaperCovers/RouePattern.jpg"
           alt=""
           aria-hidden="true">
      <div class="circle-inner">
        <img class="circle-logo"
             src="img/logos/fromScratchRecords-whiteBG-final.png"
             alt="FromScratch Records logo"
             loading="lazy">
      </div>
    </div>

    <!-- Tagline -->
    <p id="track-info" aria-live="polite">FromScratch Creative Studio</p>

    <!-- Mute toggle -->
    <button id="mute-btn" aria-label="Enable music" aria-pressed="false">
      <img id="mute-img"
           src="img/logos/mute.jpg"
           alt=""
           aria-hidden="true">
    </button>

  </main>

  <!-- ── Side navigation ───────────────────────────────────── -->
  <nav id="side-nav" aria-label="Main navigation">
    <ul role="list">

      <li>
        <div class="nav-item" data-section="fromScratchStudio">
          <button class="nav-icon" aria-label="FromScratch Studio">
            <img src="img/logos/fromScratchStudioFinal.png"
                 alt="" loading="lazy" aria-hidden="true">
          </button>
          <span class="nav-label" data-i18n="nav.studio">FromScratch Studio...</span>
        </div>
      </li>

      <li>
        <div class="nav-item" data-section="fromScratchPictures">
          <button class="nav-icon" aria-label="FromScratch Stories">
            <img src="img/logos/FromScratchPictures-WhireBGSimple.png"
                 alt="" loading="lazy" aria-hidden="true">
          </button>
          <span class="nav-label" data-i18n="nav.stories">FromScratch Stories...</span>
        </div>
      </li>

      <li>
        <div class="nav-item" data-section="fromScratchRecords">
          <button class="nav-icon" aria-label="FromScratch Records">
            <img src="img/logos/fromScratchRecords-whiteBG-final.png"
                 alt="" loading="lazy" aria-hidden="true">
          </button>
          <span class="nav-label" data-i18n="nav.records">FromScratch Records...</span>
        </div>
      </li>

      <li>
        <div class="nav-item">
          <a class="nav-icon"
             href="mailto:contact@fromscratchstudio.com?subject=Information..."
             aria-label="Contact us">
            <img src="img/logos/logocontact.jpg"
                 alt="" loading="lazy" aria-hidden="true">
          </a>
          <span class="nav-label" data-i18n="nav.contact">Contact Us</span>
        </div>
      </li>

    </ul>
  </nav>

  <!-- ── Popup modal ───────────────────────────────────────── -->
  <div id="popup"
       role="dialog"
       aria-modal="true"
       aria-hidden="true">
    <button id="popup-close" aria-label="Close">
      <img src="img/logos/FssBtn.png" alt="" loading="lazy" aria-hidden="true">
    </button>
    <div id="popup-content" tabindex="0" aria-live="polite"></div>
  </div>

  <!-- ── Off-screen preload container ─────────────────────── -->
  <div id="hidden-load" aria-hidden="true"></div>

  <!-- ── Loading overlay ───────────────────────────────────── -->
  <div id="loader" role="status" aria-label="Loading">
    <img src="img/loader/loaderBlack.gif" alt="" aria-hidden="true">
  </div>

  <!-- ── Background audio ──────────────────────────────────── -->
  <audio id="audio-track"
         src="sounds/OppressingRelease.mp3"
         loop
         preload="none"></audio>

  <!-- ── Module entry point ────────────────────────────────── -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
